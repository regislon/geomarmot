[workspace]
resolver = "3"
members = ["crates/sql", "crates/kernels", "crates/io", "crates/engine", "crates/core", "crates/app"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
duckdb = { version = "=1.10506.1", features = ["bundled", "parquet", "json", "appender-arrow"] }
serde_json = "1"
arrow = { version = "58.4.1", default-features = false, features = ["ipc", "prettyprint"] }
pollster = "0.4"
