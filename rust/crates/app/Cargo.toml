[package]
name = "geomarmot-app"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "geomarmot"
path = "src/main.rs"

[dependencies]
geomarmot-core = { path = "../core" }
geomarmot-engine = { path = "../engine" }
geomarmot-io = { path = "../io" }
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.36"
egui-snarl = "0.12"
rfd = "0.15"
serde_json.workspace = true
pollster.workspace = true

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
