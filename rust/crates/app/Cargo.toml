[package]
name = "geomarmot-app"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "geomarmot"
path = "src/main.rs"

[dependencies]
geomarmot-core = { path = "../core" }
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.36", features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
egui-snarl = "0.12"
rfd = "0.15"
serde_json.workspace = true
earcutr = "0.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
geomarmot-engine = { path = "../engine" }
geomarmot-io = { path = "../io" }
geomarmot-sql = { path = "../sql" }
geomarmot-connections = { path = "../connections" }
eframe = { version = "0.36", default-features = false, features = ["wayland", "x11"] }
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
geomarmot-web = { path = "../web" }
futures = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }
