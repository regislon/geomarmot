[package]
name = "geomarmot-kernels"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["geos"]
# The overlay kernel on native GEOS (C++); off for the browser build.
geos = ["dep:geos", "dep:rayon"]

[dependencies]
geomarmot-sql = { path = "../sql" }
geo = "0.33"
h3o = { version = "0.11", features = ["geo"] }
geographiclib-rs = "0.2"
geos = { version = "11.3.1", features = ["static", "v3_13_0"], optional = true }
rayon = { version = "1", optional = true }

[dev-dependencies]
serde_json.workspace = true
