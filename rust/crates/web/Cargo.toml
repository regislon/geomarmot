[package]
name = "geomarmot-web"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
geomarmot-core = { path = "../core" }
geomarmot-sql = { path = "../sql" }
geomarmot-raster = { path = "../raster" }
terrio = { version = "=0.8.0", default-features = false, features = ["geotiff"] }
geomarmot-conformance = { path = "../conformance" }
geomarmot-kernels = { path = "../kernels", default-features = false }
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
