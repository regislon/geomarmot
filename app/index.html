<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GeoMarmot</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="src/styles/index.css" />
  </head>
  <body>
    <div id="shell">
      <header id="toolbar">
        <h1>GeoMarmot</h1>
        <div class="tool-group">
          <button id="btn-new" class="tool" title="Start an empty workspace">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 3h8l4 4v14H6z" />
              <path d="M14 3v4h4" />
              <path d="M12 11v6M9 14h6" /></svg
            ><span>New</span>
          </button>
          <div class="menu">
            <button id="btn-open" class="tool" aria-haspopup="menu" aria-expanded="false" aria-controls="btn-open-menu">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5V10" />
                <path d="M3 6.5V19h15.5l2.5-9H6.5L3 19" /></svg
              ><span>Open <span class="caret">▾</span></span>
            </button>
            <div id="btn-open-menu" class="menu-list" role="menu" aria-labelledby="btn-open" hidden>
              <button id="menu-open-computer" role="menuitem">From this computer…</button>
              <button id="menu-open-browser" role="menuitem">From this browser…<kbd>⌘O</kbd></button>
            </div>
          </div>
          <div class="menu">
            <button id="btn-save" class="tool" aria-haspopup="menu" aria-expanded="false" aria-controls="btn-save-menu">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 3h11.5L20 6.5V21H5z" />
                <path d="M8 3v5h7V3" />
                <path d="M8 21v-7h9v7" /></svg
              ><span>Save <span class="caret">▾</span></span>
            </button>
            <div id="btn-save-menu" class="menu-list" role="menu" aria-labelledby="btn-save" hidden>
              <button id="menu-save-computer" role="menuitem">To this computer</button>
              <button id="menu-save-browser" role="menuitem">To this browser<kbd>⌘S</kbd></button>
              <button id="menu-save-browser-as" role="menuitem">To this browser as…<kbd>⇧⌘S</kbd></button>
            </div>
          </div>
        </div>
        <div class="tool-group">
          <button id="btn-export" class="tool primary" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5l11 7-11 7z" fill="currentColor" /></svg
            ><span>Run</span>
          </button>
          <button id="btn-cancel" class="tool" title="Stop writing" hidden>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" /></svg
            ><span>Cancel</span>
          </button>
        </div>
        <div class="tool-group">
          <button id="btn-undo" class="tool" title="Undo (⌘Z)" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 14L4 9l5-5" />
              <path d="M4 9h11a5 5 0 0 1 0 10h-4" /></svg
            ><span>Undo</span>
          </button>
          <button id="btn-redo" class="tool" title="Redo (⇧⌘Z)" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 14l5-5-5-5" />
              <path d="M20 9H9a5 5 0 0 0 0 10h4" /></svg
            ><span>Redo</span>
          </button>
        </div>
        <div class="tool-group">
          <button id="btn-arrange" class="tool" title="Lay the nodes out by dependency">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="7" height="5" rx="1" />
              <rect x="14" y="4" width="7" height="5" rx="1" />
              <rect x="8.5" y="15" width="7" height="5" rx="1" />
              <path d="M6.5 9v3h11V9M12 12v3" /></svg
            ><span>Arrange</span>
          </button>
          <button id="btn-assistant" class="tool" title="Build a graph by asking">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9z" />
              <path d="M18.5 14.5l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z" /></svg
            ><span>Assistant</span>
          </button>
        </div>
        <span class="spacer"></span>
        <span id="status">Starting the engine…</span>
      </header>
      <div id="progress" class="progress" role="progressbar" aria-live="polite" hidden>
        <div id="progress-label" class="progress-label"></div>
        <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
      </div>

      <main id="middle">
        <aside id="layers">
          <h2>Layers</h2>
          <div id="dropzone">Drop .parquet, .gpkg, .geojson, .json, .fgb, .csv or .xlsx here</div>
          <div class="url-row">
            <input id="url-input" type="text" placeholder="gs://bucket/file.gpkg, …/store.zarr or https://…" />
            <button id="btn-load-url">Load</button>
          </div>
          <button id="btn-browse" class="wide-btn">Browse a bucket…</button>
          <div id="source-list"></div>

          <h2 class="rail-section">Transformers</h2>
          <div id="palette"></div>
        </aside>

        <section id="canvas-wrap">
          <svg id="canvas"></svg>
          <div id="quick-add" hidden>
            <input
              id="quick-add-input"
              type="text"
              placeholder="Add a transformer…"
              autocomplete="off"
              spellcheck="false"
            />
            <ul id="quick-add-list"></ul>
          </div>
        </section>

        <aside id="inspector"></aside>

        <aside id="assistant" hidden>
          <div class="assistant-head">
            <h2>Assistant</h2>
            <span class="meta" id="assistant-level"></span>
            <button id="assistant-settings" title="Assistant settings">⚙</button>
            <button id="assistant-close" title="Close">×</button>
          </div>
          <div id="assistant-log"></div>
          <form id="assistant-form">
            <textarea
              id="assistant-input"
              rows="3"
              placeholder="Ask for a graph: “points from the E/N columns”"
            ></textarea>
            <div class="assistant-actions">
              <button id="assistant-stop" type="button" hidden>Stop</button>
              <button id="assistant-send" type="submit" class="primary">Send</button>
            </div>
          </form>
        </aside>
      </main>

      <div id="dock-resizer"></div>

      <section id="dock">
        <div class="panel">
          <div class="panel-head">
            <h2>Attributes</h2>
            <span id="inspect-pin" class="badge pin" hidden></span>
            <span class="meta" id="table-meta"></span>
            <button id="table-prev" title="Previous page">‹</button>
            <button id="table-next" title="Next page">›</button>
          </div>
          <div class="sheet-area">
            <div id="sheet-tabs" hidden></div>
            <div class="table-scroll">
              <table>
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="dock-splitter" title="Drag to resize; double-click for an even split"></div>

        <div class="panel">
          <div class="panel-head">
            <h2>Geometry</h2>
            <span class="meta" id="map-status"></span>
            <select id="coarsen-select" title="Roll H3 cells up to a coarser resolution"></select>
            <select id="limit-select" title="How many features to draw">
              <option value="8000">8k</option>
              <option value="25000">25k</option>
              <option value="50000">50k</option>
              <option value="100000">100k</option>
              <option value="250000">250k</option>
              <option value="">No limit</option>
            </select>
            <select id="basemap-select" title="Basemap"></select>
          </div>
          <div class="map-wrap">
            <div id="map"></div>
            <div id="map-legend" class="map-legend" hidden></div>
          </div>
        </div>
      </section>
    </div>

    <div id="workspace-modal" class="modal" hidden>
      <div class="modal-panel workspace-panel">
        <div class="modal-head">
          <h2 id="workspace-title">Workspaces in this browser</h2>
          <button id="workspace-close" title="Close">×</button>
        </div>
        <div id="workspace-body"></div>
      </div>
    </div>

    <div id="ai-settings-modal" class="modal" hidden>
      <div class="modal-panel ai-settings-panel">
        <div class="modal-head">
          <h2>Assistant settings</h2>
          <button id="ai-settings-close" title="Close">×</button>
        </div>
        <div id="ai-settings-body"></div>
        <div class="modal-foot">
          <button id="ai-settings-save" class="primary">Save</button>
        </div>
      </div>
    </div>

    <div id="help-modal" class="modal" hidden>
      <div class="modal-panel help-panel">
        <div class="modal-head">
          <h2 id="help-title"></h2>
          <button id="help-close" class="icon-btn" title="Close">×</button>
        </div>
        <div id="help-body" class="help-body"></div>
      </div>
    </div>

    <div id="geometry-modal" class="modal" hidden>
      <div class="modal-panel">
        <div class="modal-head">
          <h2>Feature</h2>
          <button id="geometry-close" class="icon-btn" title="Close">×</button>
        </div>
        <div id="geometry-body" class="geometry-body"></div>
      </div>
    </div>

    <div id="browse-modal" class="modal" hidden>
      <div class="modal-panel">
        <div class="modal-head">
          <h2>Browse a bucket</h2>
          <button id="browse-close" class="icon-btn" title="Close">×</button>
        </div>
        <div class="url-row">
          <input id="browse-bucket" type="text" autocomplete="off" spellcheck="false" placeholder="bucket name" />
          <button id="browse-go">Open</button>
        </div>
        <div id="browse-path" class="browse-path"></div>
        <div id="browse-list" class="browse-list"></div>
        <p id="browse-note" class="muted"></p>
      </div>
    </div>

    <div id="zarr-modal" class="modal" hidden>
      <div class="modal-panel zarr-panel">
        <div class="modal-head">
          <h2 id="zarr-title"></h2>
          <button id="zarr-close" class="icon-btn" title="Close">×</button>
        </div>
        <div class="zarr-body">
          <div id="zarr-variables" class="zarr-variables"></div>
          <div id="zarr-plan" class="zarr-plan"></div>
        </div>
        <p id="zarr-note" class="muted"></p>
        <button id="zarr-add" class="primary wide-btn" disabled>Add layer</button>
      </div>
    </div>

    <div id="sheet-modal" class="modal" hidden>
      <div class="modal-panel sheet-panel">
        <div class="modal-head">
          <h2 id="sheet-title"></h2>
          <button id="sheet-close" class="icon-btn" title="Close">×</button>
        </div>
        <p id="sheet-hint" class="muted"></p>
        <div id="sheet-body" class="sheet-body"></div>
        <div class="sheet-footer">
          <button id="sheet-back" hidden>Back</button>
          <button id="sheet-add" class="primary">Open</button>
        </div>
      </div>
    </div>

    <input
      id="file-input"
      type="file"
      accept=".parquet,.pq,.gpkg,.geojson,.json,.fgb,.csv,.tsv,.csv.gz,.tsv.gz,.xlsx,.xlsm"
      multiple
      hidden
    />
    <input id="graph-input" type="file" accept=".json" hidden />

    <script type="module" src="src/main.js"></script>
  </body>
</html>
