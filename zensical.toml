# The GitHub Pages site (npm run build:site). The pages come from README.md, CONTRIBUTING.md and
# docs/, staged into _site_src/ by scripts/build-site.js; the app is added under demo/.

[project]
site_name = "GeoMarmot"
site_description = "Spatial ETL in your browser."
site_url = "https://regislon.github.io/geomarmot/"
repo_url = "https://github.com/regislon/geomarmot"
repo_name = "regislon/geomarmot"
copyright = "Apache-2.0"
docs_dir = "_site_src"
site_dir = "_site"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Launch the demo" = "https://regislon.github.io/geomarmot/demo/" },
  { "Using GeoMarmot" = [
    { "Formats" = "formats.md" },
    { "Security and privacy" = "security.md" },
    { "Parity" = "parity.md" },
  ] },
  { "How it works" = [
    { "Architecture" = "architecture.md" },
    { "Engines" = "engines.md" },
  ] },
  { "Contributing" = [
    { "Getting started" = "contributing.md" },
    { "Transformer API" = "transformer-api.md" },
    { "Params and fixtures" = "params.md" },
    { "Code economy" = "code-economy.md" },
    { "Debt" = "debt.md" },
  ] },
]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
